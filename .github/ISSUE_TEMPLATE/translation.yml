name: Translation
description: Add a language or fix a translation.
labels: [i18n]
body:
  - type: input
    id: language
    attributes:
      label: Language and region
      placeholder: Spanish (es)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Mention any strings that are unclear or need context. Keep the translation file key list in sync with public/locales/en.json.
