name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      # Only Node's built-in modules run here, so no npm install is needed.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The Firebase config is committed in public/js/firebase-config.js, so only the site URL is filled here.
      - name: Fill the site URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/write-config.mjs --site-only
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
