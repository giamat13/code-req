name: Deploy to Firebase

# Manual only. Run it from the Actions tab after the rules tests pass on main.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy rules, indexes, and Hosting
    runs-on: ubuntu-latest
    environment: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write Firebase config and site URL
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run config
      - name: Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json" \
            npx firebase deploy --only firestore,hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
