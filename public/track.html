<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://apis.google.com http://127.0.0.1:9099 http://127.0.0.1:8080 ws://127.0.0.1:8080 http://localhost:9099 http://localhost:8080 ws://localhost:8080; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title data-i18n="track.pageTitleDefault">Your request · code-req</title>
    <meta name="description" data-i18n-attr="content:track.metaDescription" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/pages/track.css" />
  </head>
  <body class="page-track">
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>

    <header class="site-header">
      <div class="container site-header-inner">
        <a class="brand" href="index.html" data-i18n="common.appName">code-req</a>
        <button
          id="nav-toggle"
          class="icon-button nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
          data-i18n-attr="aria-label:nav.menu"
        >
          <span aria-hidden="true">☰</span>
        </button>
        <nav id="site-nav" class="site-nav" aria-label="Main" data-open="false">
          <a href="index.html" data-nav data-i18n="nav.directory">Developers</a>
          <a href="dashboard.html" data-nav data-i18n="nav.forDevelopers">For developers</a>
          <a href="privacy.html" data-nav data-i18n="nav.privacy">Privacy</a>
        </nav>
        <div class="site-controls">
          <select
            id="language-select"
            class="select-compact"
            data-i18n-attr="aria-label:nav.language"
          ></select>
          <button id="theme-toggle" class="icon-button" type="button"></button>
        </div>
      </div>
    </header>

    <main id="main" class="container main-track" tabindex="-1">
      <div id="track-main">
        <header id="track-header" class="track-header"></header>
        <div class="track-grid">
          <div class="track-primary">
            <section id="track-status" class="track-status" aria-label="Status"></section>
            <section id="track-quote" class="card"></section>
            <section id="track-summary" class="card"></section>
            <section id="thread" class="card thread-card" aria-labelledby="thread-title">
              <h2 id="thread-title" class="section-title" data-i18n="track.threadTitle">
                Messages
              </h2>
              <ol
                id="thread-list"
                class="thread-list"
                aria-live="polite"
                aria-label="Messages"
              ></ol>
              <p id="thread-status" class="form-status" role="status" aria-live="polite"></p>
              <form id="composer" class="composer" novalidate>
                <label class="field-label" for="composer-body" data-i18n="track.composerLabel"
                  >Message the developer</label
                >
                <textarea
                  id="composer-body"
                  rows="3"
                  data-i18n-attr="placeholder:track.composerPlaceholder"
                  placeholder="Write a message"
                ></textarea>
                <div class="composer-foot">
                  <span id="composer-counter" class="field-counter"></span>
                  <button
                    id="composer-send"
                    class="btn btn-primary btn-sm"
                    type="submit"
                    data-i18n="track.send"
                  >
                    Send
                  </button>
                </div>
                <p
                  id="composer-status"
                  class="form-status"
                  role="status"
                  aria-live="polite"
                  hidden
                ></p>
              </form>
              <p id="composer-closed" class="muted" hidden data-i18n="track.composerClosed">
                This request is cancelled, so messages are closed.
              </p>
            </section>
          </div>
          <aside class="track-secondary">
            <section id="track-developer" class="card"></section>
            <section id="track-contact" class="card"></section>
            <section id="track-actions" class="card-actions"></section>
          </aside>
        </div>
      </div>
      <p id="live-indicator" class="live-indicator" hidden>
        <span class="live-dot" aria-hidden="true"></span>
        <span data-i18n="track.live">Live</span>
      </p>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>
          <span data-i18n="common.license">MIT licensed.</span>
          <a href="https://github.com/giamat13/code-req" rel="noopener" data-i18n="common.source"
            >Source code</a
          >
        </p>
        <p>
          <a href="privacy.html" data-i18n="nav.privacy">Privacy</a>
          · <span id="year"></span>
        </p>
      </div>
    </footer>

    <p
      id="setup-notice"
      class="notice notice-warning setup-banner"
      hidden
      data-i18n="setup.notConfigured"
    >
      This site is not connected to a Firebase project yet.
    </p>

    <script type="module" src="./js/pages/track.js"></script>
  </body>
</html>
